<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIS | Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fb; }
    h1 { color: #1a73e8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #1a73e8; color: white; }
    input, button { margin: 5px; padding: 8px; }
    button { background: #1a73e8; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:hover { background: #1558b0; }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <button onclick="logout()">Logout</button>

  <h2 id="formTitle">Add Student</h2>
  <input id="name" placeholder="Name">
  <input id="course" placeholder="Course">
  <input id="year" placeholder="Year">
  <input id="grade" type="number" step="0.25" placeholder="Grade (e.g. 1.75)">
  <button id="submitBtn" onclick="addStudent()">Add</button>

  <h2>All Students</h2>
  <table id="studentTable">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Course</th><th>Year</th><th>Grade</th><th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = "http://localhost:3000/api";
    let editingId = null;

    async function fetchStudents() {
      const res = await fetch(`${API}/students`);
      const data = await res.json();
      const tbody = document.querySelector("#studentTable tbody");
      tbody.innerHTML = "";
      data.forEach(s => {
        tbody.innerHTML += `
          <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.course}</td>
            <td>${s.year}</td>
            <td>${s.grade}</td>
            <td>
              <button onclick="editStudent(${s.id}, '${s.name}', '${s.course}', '${s.year}', '${s.grade}')">Edit</button>
              <button onclick="deleteStudent(${s.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    async function addStudent() {
      const name = document.getElementById("name").value;
      const course = document.getElementById("course").value;
      const year = document.getElementById("year").value;
      const grade = document.getElementById("grade").value;

      if (!name || !course || !year || !grade) {
        alert("Please fill in all fields");
        return;
      }

      if (editingId) {
        // Update existing record
        await fetch(`${API}/students/${editingId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, course, year, grade })
        });
        editingId = null;
        document.getElementById("submitBtn").textContent = "Add";
        document.getElementById("formTitle").textContent = "Add Student";
      } else {
        // Add new record
        await fetch(`${API}/students`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, course, year, grade })
        });
      }

      clearForm();
      fetchStudents();
    }

    function editStudent(id, name, course, year, grade) {
      document.getElementById("name").value = name;
      document.getElementById("course").value = course;
      document.getElementById("year").value = year;
      document.getElementById("grade").value = grade;
      editingId = id;
      document.getElementById("submitBtn").textContent = "Update";
      document.getElementById("formTitle").textContent = "Edit Student";
    }

    function clearForm() {
      document.getElementById("name").value = "";
      document.getElementById("course").value = "";
      document.getElementById("year").value = "";
      document.getElementById("grade").value = "";
    }

    async function deleteStudent(id) {
      if (confirm("Are you sure you want to delete this student?")) {
        await fetch(`${API}/students/${id}`, { method: "DELETE" });
        fetchStudents();
      }
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "./login.html";
    }

    fetchStudents();
  </script>
</body>
</html>
