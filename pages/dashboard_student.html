<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIS | Student Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fb; }
    h1 { color: #1a73e8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #1a73e8; color: white; }
  </style>
</head>
<body>
  <h1>Student Dashboard</h1>
  <button onclick="logout()">Logout</button>

  <table id="studentInfo">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Course</th><th>Year</th><th>Grade</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    const API = "http://localhost:3000/api";

    async function fetchStudent() {
      const res = await fetch(`${API}/students`);
      const data = await res.json();
      const tbody = document.querySelector("#studentInfo tbody");
      tbody.innerHTML = "";

      // for now just show all students (optional: filter by logged-in student)
      data.forEach(s => {
        tbody.innerHTML += `
          <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.course}</td>
            <td>${s.year}</td>
            <td>${s.grade}</td>
          </tr>
        `;
      });
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "./login.html";
    }

    fetchStudent();
  </script>
</body>
</html>
